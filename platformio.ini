; PlatformIO Project Configuration File for ENCO-02 Robot
; Main Controller: ESP32 IoT Board + 2.0" ST7789 Color LCD

[platformio]
src_dir = src

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
upload_speed = 460800
monitor_speed = 115200
custom_component_remove =
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp-dsp
  espressif/esp32-camera
  espressif/libsodium
  espressif/esp-modbus
  espressif/qrcode
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp_rainmaker
  espressif/rmaker_common
build_flags =
  -fno-exceptions
  -Wall
  -Werror
  -Wno-error=unused-variable
  -llibopus
  -llibesp_audio_codec
  -llibesp_audio_simple_dec
  -Os

build_src_filter =
  +<**/*.c>
  +<**/*.cpp>
  -<**/*.S>
  -<**/*.asm>

[env:enco02_main]
board = esp32dev
board_build.mcu = esp32
extra_scripts = pre:tools/gen_web_page.py
build_src_filter =
  ${env.build_src_filter}
  +<../firmware/main/*.c*>
build_flags =
  ${env.build_flags}
  -Lsrc/${this.board_build.mcu}
  -D LV_LVGL_H_INCLUDE_SIMPLE
  ; Arduino's loopTask defaults to 8192 bytes; measured peak here is 2,960. Reclaiming 3KB of DRAM
  ; matters because the Wi-Fi driver allocates its receive buffers from that same heap.
  -D ARDUINO_LOOP_STACK_SIZE=5120
  -I firmware/main/
lib_deps =
  lvgl/lvgl@9.2.2
  WebServer
  WiFi
board_build.partitions = firmware/main/partitions_4M.csv

; ---------------------------------------------------------------------------
; Vision module - a physically separate ESP32-CAM in the robot's head.
;
;   pio run -e enco02_cam -t upload
;
; Shares nothing with enco02_main but the repository. In particular it does not
; inherit [env].build_flags: those link the Opus and audio codec blobs out of
; src/esp32/, which do not exist for this board and would fail the link.
; ---------------------------------------------------------------------------
[env:enco02_cam]
board = esp32cam
board_build.mcu = esp32
; Two 1.9MB app slots, so the camera can be updated over WiFi (ArduinoOTA,
; enco02_cam_ota below) instead of being taken out of the head for USB. Was
; huge_app.csv (one 3MB slot, no OTA); the firmware is ~1.3MB, and nothing is
; ever stored on this board - the JPEG goes straight from PSRAM to the network.
; Changing the partition table needs one USB flash; after that OTA works.
board_build.partitions = min_spiffs.csv
; esp32-camera is stripped for the main board, which must never see it. Here it
; is the entire point, so the removal list is re-stated without it.
custom_component_remove =
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp-dsp
  espressif/libsodium
  espressif/esp-modbus
  espressif/qrcode
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp_rainmaker
  espressif/rmaker_common
build_src_filter =
  -<**>
  +<../firmware/cam/*.cpp>
build_flags =
  -fno-exceptions
  -Wall
  -Werror
  -Os
  ; A QVGA RGB565 frame is 150KB and a base64 VGA JPEG is ~45KB. Neither fits in
  ; internal DRAM, so this board is useless without PSRAM.
  -D BOARD_HAS_PSRAM
  -I firmware/cam/
lib_deps =
  WiFi
  NetworkClientSecure
  HTTPClient
  WebServer
  ; Framework built-ins (arduino-esp32), for OTA. Only used when cam_config.h
  ; defines CAM_OTA_PASSWORD.
  ArduinoOTA
  Update
  ESPmDNS
; Overrides the 921600 in [env], which the main board needs but which the
; CH340 on an ESP32-CAM / ESP32-CAM-MB drops packets at. If even this fails,
; try 115200 - a slow flash is better than a corrupt one.
upload_speed = 460800

; The same camera firmware, uploaded over WiFi. Needs the USB flash above done
; once with CAM_OTA_PASSWORD set in cam_config.h. The password comes from the
; environment so it never has to be written here:
;   ENCO_CAM_OTA_PASSWORD=<same as cam_config.h> pio run -e enco02_cam_ota -t upload
; upload_port is the camera's DHCP address; change it if the router moves it.
[env:enco02_cam_ota]
extends = env:enco02_cam
upload_protocol = espota
upload_port = 192.168.86.65
upload_flags =
  --auth=${sysenv.ENCO_CAM_OTA_PASSWORD}
